{% extends "base.html" %}
{% block body %}
<section class="auth-card mx-auto">
  <h1 class="text-headline-lg">Ενεργοποίηση 2FA</h1>
  <ol class="mb-4 mt-3 list-decimal space-y-1 pl-5 text-body-md secondary">
    <li>Άνοιξε μια εφαρμογή authenticator (Google Authenticator, Microsoft Authenticator, Authy…).</li>
    <li>Σκάναρε τον κωδικό QR — ή πληκτρολόγησε τον κωδικό από κάτω.</li>
    <li>Γράψε τον 6ψήφιο κωδικό που εμφανίζεται.</li>
  </ol>
  <div class="rounded-xl border border-border-light p-4 text-center dark:border-border-dark">
    <img class="mx-auto h-52 w-52 rounded-lg bg-white p-2" src="{{ qr }}" alt="QR για την εφαρμογή authenticator">
    <div class="mt-3 flex items-center justify-center gap-2">
      <code class="break-all font-mono text-label-lg tracking-widest" id="totp-secret">{{ secret }}</code>
      <button type="button" class="btn-ghost btn-sm" data-copy="#totp-secret">{{ icon('copy', 'icon-sm') }} Αντιγραφή</button>
    </div>
  </div>
  <form method="post" action="{{ url_for('auth.enroll') }}" class="mt-4 flex flex-col gap-3">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required placeholder="••••••" autofocus class="code-input" data-otp aria-label="6ψήφιος κωδικός">
    <button class="btn-primary btn-block h-12">Ενεργοποίηση</button>
  </form>
</section>
{% endblock %}
