{% extends "base.html" %}
{% block title %}Σύνδεση — {{ S.title }}{% endblock %}
{% block body %}
<section class="auth-card">
  <h1 class="text-headline-lg">Σύνδεση</h1>
  <p class="mb-5 mt-1 text-body-md muted">Καλώς ήρθες πίσω.</p>
  <form method="post" action="{{ url_for('auth.login') }}" class="flex flex-col gap-4">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label><span class="label">Email</span><input type="email" name="email" value="{{ email }}" autocomplete="username" required maxlength="254" autofocus class="input"></label>
    <label><span class="label flex justify-between">Κωδικός <a class="link text-label-md" href="{{ url_for('auth.forgot') }}">Ξέχασα τον κωδικό</a></span>
      <input type="password" name="password" autocomplete="current-password" required maxlength="200" class="input"></label>
    {% include "auth/_turnstile.html" %}
    <button class="btn-primary btn-block h-12">Σύνδεση</button>
  </form>
  {% if GOOGLE_ENABLED %}
  <div class="my-4 flex items-center gap-3 text-body-sm muted"><span class="h-px flex-1 bg-border-light dark:bg-border-dark"></span>ή<span class="h-px flex-1 bg-border-light dark:bg-border-dark"></span></div>
  <a class="btn-secondary btn-block h-12" href="{{ url_for('auth.google', next=next or None) }}">Συνέχεια με Google</a>
  {% endif %}
  <p class="mt-6 text-center text-body-md muted">Δεν έχεις λογαριασμό; <a class="link" href="{{ url_for('auth.signup') }}">Εγγραφή</a></p>
</section>
{% endblock %}
