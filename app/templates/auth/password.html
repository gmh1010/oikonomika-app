{% extends "base.html" %}
{% block body %}
<section class="auth-card mx-auto">
  <h1 class="text-headline-lg">Νέος κωδικός</h1>
  <p class="mb-5 mt-1 text-body-md muted">Μετά την αλλαγή θα αποσυνδεθείς από όλες τις άλλες συσκευές.</p>
  <form method="post" action="{{ url_for('auth.password') }}" class="flex flex-col gap-4">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label><span class="label">Νέος κωδικός</span>
      <input type="password" name="password" autocomplete="new-password" required minlength="10" maxlength="72" autofocus class="input">
      <span class="mt-1 block text-body-sm muted">Τουλάχιστον 10 χαρακτήρες, με γράμματα και αριθμούς.</span></label>
    <label><span class="label">Ξανά</span><input type="password" name="password2" autocomplete="new-password" required minlength="10" maxlength="72" class="input"></label>
    <button class="btn-primary btn-block h-12">Αποθήκευση</button>
  </form>
</section>
{% endblock %}
